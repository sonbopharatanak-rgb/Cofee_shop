<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <form id="registrationForm">
                        <div class="text-center mb-4">
                            <h2>Create Account</h2>
                            <p class="text-muted small">Fill out the form below to register.</p>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">First Name</label>
                                <input type="text" id="firstName" class="form-control" placeholder="First Name" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="lastName" class="form-control" placeholder="Last Name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select id="gender" class="form-select" required>
                                <option value="" selected disabled>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
                        
                        <div class="text-center">
                            <a href="user-list.html" class="btn btn-outline-secondary btn-sm w-100">View Registered Users</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const registrationForm = document.getElementById('registrationForm');

        registrationForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // 1. Get existing users array, or create empty array if none exist
            let userList = JSON.parse(localStorage.getItem('users')) || [];

            // 2. Gather form data
            const userData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                gender: document.getElementById('gender').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            // 3. Add new user to the array
            userList.push(userData);

            // 4. Save updated array back to localStorage
            localStorage.setItem('users', JSON.stringify(userList));

            // 5. Clear form fields
            registrationForm.reset();

            // 6. Redirect to user list page
            window.location.href = "user-list.html";
        });
    </script>
</body>
</html>
