<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Registered Users Directory</h2>
                <a href="register.html" class="btn btn-primary">+ Add New User</a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Full Name</th>
                            <th>Gender</th>
                            <th>Email Address</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Javascript will inject data rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Retrieve elements
        const userTableBody = document.getElementById('userTableBody');
        
        // Load profiles from storage
        let userList = JSON.parse(localStorage.getItem('users')) || [];

        // Run render function instantly when page opens
        renderTable();

        function renderTable() {
            // Clean table space
            userTableBody.innerHTML = "";

            // Corner case: Handle empty directory database safely
            if (userList.length === 0) {
                userTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                            No registered accounts found. Click '+ Add New User' to build a profile.
                        </td>
                    </tr>`;
                return;
            }

            // Populate text rows systematically 
            userList.forEach((user, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${index + 1}</b></td>
                    <td>${user.firstName} ${user.lastName}</td>
                    <td><span class="badge bg-secondary">${user.gender}</span></td>
                    <td>${user.email}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${index})">Remove</button>
                    </td>
                `;
                userTableBody.appendChild(tr);
            });
        }

        // Delete user logic
        function deleteUser(index) {
            if (confirm("Are you sure you want to permanently remove this user account?")) {
                // Cut item array element index away
                userList.splice(index, 1);
                
                // Sync modified collection to LocalStorage
                localStorage.setItem('users', JSON.stringify(userList));
                
                // Re-render display layout
                renderTable();
            }
        }
    </script>
</body>
</html>
